<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>漢字手書きバトル IV - バランス調整版 -</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #090d16;
      color: #fff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* バトル画面 Canvas */
    .stage-card {
      position: relative;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 2px solid #1f2937;
    }

    #stageCanvas {
      width: 100%;
      height: 200px;
      display: block;
      background: #000;
    }

    /* HUD (HPバー等) */
    .hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .fighter-hud {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .fighter-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .hp-bar-bg {
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #475569;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
    }

    .player-hp { background: linear-gradient(90deg, #10b981, #34d399); }
    .enemy-hp { background: linear-gradient(90deg, #ef4444, #f87171); }

    /* コマンド＆手書きエリア */
    .controls-card {
      background: #111827;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 2px solid #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* キャラ選択 */
    .char-select-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #1f2937;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    .char-select-bar select {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* お題指示表示 */
    .target-box {
      width: 100%;
      background: #030712;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.25);
      position: relative;
    }

    .target-title {
      font-size: 10px;
      color: #9ca3af;
    }

    .target-kanji-display {
      font-size: 28px;
      font-weight: 900;
      color: #fbbf24;
      line-height: 1.1;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .target-desc {
      font-size: 11px;
      color: #d1d5db;
      font-weight: bold;
    }

    /* コンボゲージ表示 */
    .combo-badge {
      display: none;
      font-size: 12px;
      color: #f43f5e;
      font-weight: bold;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* 手書きCanvas wrapping */
    .canvas-wrapper {
      position: relative;
      touch-action: none;
    }

    #drawCanvas {
      border: 3px solid #f59e0b;
      border-radius: 12px;
      background-color: #1f2937;
      cursor: crosshair;
      touch-action: none;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
    }

    /* お手本文字ガイドガイド */
    .canvas-guide-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 140px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.08);
      pointer-events: none;
      line-height: 1;
    }

    .canvas-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 12px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-fist {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      flex: 1;
      font-size: 15px;
    }

    .btn-kick {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      flex: 1;
      font-size: 15px;
    }

    .btn-clear {
      background: #4b5563;
      color: white;
      flex: 0.8;
    }

    .btn-attack {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      flex: 1.5;
      font-size: 15px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }

    /* メッセージ表示 */
    .msg-banner {
      min-height: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #38bdf8;
      text-align: center;
    }

    /* 勝敗モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #111827;
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid #f59e0b;
      max-width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-btn {
      background: #f59e0b;
      color: #111;
      font-size: 18px;
      padding: 10px 24px;
      margin-top: 15px;
      width: 100%;
    }

    /* オフライン・フォールバック */
    .fallback-select {
      display: none;
      margin-top: 2px;
      font-size: 11px;
      color: #9ca3af;
    }
    .fallback-select select {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- バトル画面 Canvas -->
  <div class="stage-card">
    <canvas id="stageCanvas" width="500" height="200"></canvas>

    <div class="hud">
      <div class="fighter-hud">
        <div class="fighter-name">
          <span id="playerName">武神 (YOU)</span>
          <span id="playerHpText">100/100</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill player-hp" id="playerHpBar"></div>
        </div>
      </div>

      <div class="fighter-hud">
        <div class="fighter-name">
          <span id="enemyName">羅刹王 (BOSS)</span>
          <span id="enemyHpText">200/200</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill enemy-hp" id="enemyHpBar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作・手書きエリア -->
  <div class="controls-card">
    <!-- キャラクター選択 -->
    <div class="char-select-bar">
      <div>
        自キャラ:
        <select id="playerCharSelect" onchange="changePlayerCharacter()">
          <option value="bujin">武神 (標準)</option>
          <option value="hayate">疾風 (高速)</option>
          <option value="goken">剛拳 (力豪)</option>
        </select>
      </div>
      <div>
        対戦相手:
        <select id="enemyCharSelect" onchange="changeEnemyCharacter()">
          <option value="rasetsu">羅刹王 (標準)</option>
          <option value="houou">鳳凰帝 (高速)</option>
          <option value="ankoku">暗黒騎士 (耐久)</option>
        </select>
      </div>
    </div>

    <!-- お題指示表示 -->
    <div class="target-box">
      <div class="target-title">【目標漢字コマンド（書くと自動判定）】</div>
      <div class="target-kanji-display" id="targetKanji">絶</div>
      <div class="target-desc" id="targetDesc">絶影連撃 (威力: 32)</div>
      <div class="combo-badge" id="comboBadge">🔥 7連超必殺コンボ進行中！ 🔥</div>
    </div>

    <!-- メッセージ -->
    <div class="msg-banner" id="msgBanner">手書きすると自動で判定＆技発動！</div>

    <!-- 手書きCanvas -->
    <div class="canvas-wrapper">
      <div class="canvas-guide-text" id="canvasGuide">絶</div>
      <canvas id="drawCanvas" width="200" height="200"></canvas>
      <svg class="canvas-grid" viewBox="0 0 200 200">
        <line x1="100" y1="0" x2="100" y2="200" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4" />
        <line x1="0" y1="100" x2="200" y2="100" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4" />
      </svg>
    </div>

    <!-- ボタン群 -->
    <div class="btn-row">
      <button class="btn-fist" id="btnFist" onclick="normalAttack('fist')">拳 (パンチ)</button>
      <button class="btn-kick" id="btnKick" onclick="normalAttack('kick')">蹴 (キック)</button>
      <button class="btn-clear" onclick="clearDrawCanvas()">消去</button>
      <button class="btn-attack" id="attackBtn" onclick="castSkill()">手動判定</button>
    </div>

    <!-- オフライン/ローカル時フォールバック -->
    <div class="fallback-select" id="fallbackArea">
      API未接続時手動選択:
      <select id="manualKanji">
        <option value="拳">拳 (パンチ)</option>
        <option value="蹴">蹴 (キック)</option>
        <option value="絶">絶 (絶影連撃)</option>
        <option value="滅">滅 (滅殺波動)</option>
        <option value="擂">擂 (擂台崩落)</option>
        <option value="爆">爆 (爆炎連打)</option>
        <option value="鐳">鐳 (鐳光破撃)</option>
        <option value="改">改 (改天換地)</option>
        <option value="雷">雷 (雷帝召喚)</option>
      </select>
    </div>
  </div>
</div>

<!-- 勝敗判定モーダル -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">VICTORY!</div>
    <p id="modalDesc">見事なコンボで撃破した！</p>
    <button class="modal-btn" onclick="resetGame()">再戦する</button>
  </div>
</div>

<script>
// --- キャラデータ ---
const PLAYER_CHARS = {
  bujin: { name: '武神', hp: 100, color: '#38bdf8', powerMult: 1.0 },
  hayate: { name: '疾風', hp: 85, color: '#2dd4bf', powerMult: 0.9 },
  goken: { name: '剛拳', hp: 130, color: '#fb923c', powerMult: 1.25 }
};

const ENEMY_CHARS = {
  rasetsu: { name: '羅刹王', hp: 200, color: '#f43f5e', attackInterval: 260 },
  houou: { name: '鳳凰帝', hp: 160, color: '#facc15', attackInterval: 200 },
  ankoku: { name: '暗黒騎士', hp: 250, color: '#a855f7', attackInterval: 300 }
};

// --- 漢字技データ ---
const SKILLS = {
  '拳': { name: '直拳衝', damage: 4, color: '#2563eb' },
  '蹴': { name: '疾風蹴', damage: 6, color: '#0284c7' },
  '絶': { name: '絶影連撃', damage: 32, color: '#38bdf8' },
  '滅': { name: '滅殺波動', damage: 40, color: '#f43f5e' },
  '擂': { name: '擂台崩落', damage: 38, color: '#a855f7' },
  '爆': { name: '爆炎連打', damage: 45, color: '#f97316' },
  '鐳': { name: '鐳光破撃', damage: 50, color: '#eab308' },
  '改': { name: '改天換地', damage: 38, color: '#10b981' },
  '雷': { name: '雷帝召喚', damage: 55, color: '#c084fc' }
};

// 7連コンボ（超必殺技の漢字シーケンス）
const ULTIMATE_COMBO = ['絶', '滅', '擂', '爆', '鐳', '改', '雷'];
let comboIndex = -1;

const KANJI_KEYS = ['絶', '滅', '擂', '爆', '鐳', '改', '雷', '拳', '蹴'];
let currentTargetKey = '絶';

function setRandomTarget() {
  if (comboIndex === -1 && Math.random() < 0.15) {
    comboIndex = 0;
  }

  if (comboIndex >= 0) {
    currentTargetKey = ULTIMATE_COMBO[comboIndex];
    document.getElementById('comboBadge').style.display = 'block';
    document.getElementById('targetKanji').textContent = `超必殺コンボ [${comboIndex + 1}/7]: 【${currentTargetKey}】`;
  } else {
    document.getElementById('comboBadge').style.display = 'none';
    currentTargetKey = KANJI_KEYS[Math.floor(Math.random() * KANJI_KEYS.length)];
    document.getElementById('targetKanji').textContent = currentTargetKey;
  }

  const sk = SKILLS[currentTargetKey] || { name: '連撃', damage: 30, color: '#fbbf24' };
  document.getElementById('targetKanji').style.color = sk.color;
  document.getElementById('targetDesc').textContent = `${sk.name} (威力: ${sk.damage})`;
  document.getElementById('canvasGuide').textContent = currentTargetKey;
}

// --- ゲーム状態 ---
let currentCharKey = 'bujin';
let currentEnemyKey = 'rasetsu';

let player = { hp: 100, maxHp: 100, x: 120, baseTargetX: 120, y: 140, state: 'idle', timer: 0, powerMult: 1.0 };
let enemy = { hp: 200, maxHp: 200, x: 370, baseTargetX: 370, y: 140, state: 'idle', timer: 0, attackCooldown: 260 };

let effects = [];
let particles = [];
let gameActive = true;
let shakeAmount = 0;
let flashOverlay = 0;
let autoTimer = null;
let attackCooldownTimer = false; // パンチ・キックの連打防止

function changePlayerCharacter() {
  currentCharKey = document.getElementById('playerCharSelect').value;
  const c = PLAYER_CHARS[currentCharKey];
  // キャラ変更時も現在のHP割合をそのまま引き継ぐ
  const hpRatio = player.hp / player.maxHp;
  player.maxHp = c.hp;
  player.hp = Math.max(1, Math.round(c.hp * hpRatio));
  player.powerMult = c.powerMult;
  document.getElementById('playerName').textContent = `${c.name} (YOU)`;
  updateHpUI();
}

function changeEnemyCharacter() {
  currentEnemyKey = document.getElementById('enemyCharSelect').value;
  const e = ENEMY_CHARS[currentEnemyKey];
  // 敵キャラ変更時もHP割合を引き継ぐ
  const hpRatio = enemy.hp / enemy.maxHp;
  enemy.maxHp = e.hp;
  enemy.hp = Math.max(1, Math.round(e.hp * hpRatio));
  enemy.attackCooldown = e.attackInterval;
  document.getElementById('enemyName').textContent = `${e.name} (BOSS)`;
  updateHpUI();
}

// --- 手書きキャンバス処理 ---
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');
let isDrawing = false;
let currentStrokes = [];
let currentStrokeX = [];
let currentStrokeY = [];

drawCtx.lineWidth = 8;
drawCtx.lineCap = 'round';
drawCtx.lineJoin = 'round';
drawCtx.strokeStyle = '#f59e0b';

function startDrawing(e) {
  if (!gameActive) return;
  if (autoTimer) clearTimeout(autoTimer);

  isDrawing = true;
  const rect = drawCanvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  drawCtx.beginPath();
  drawCtx.moveTo(x, y);

  currentStrokeX = [x];
  currentStrokeY = [y];
}

function draw(e) {
  if (!isDrawing) return;
  const rect = drawCanvas.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;

  drawCtx.lineTo(x, y);
  drawCtx.stroke();

  currentStrokeX.push(x);
  currentStrokeY.push(y);
}

function stopDrawing() {
  if (isDrawing) {
    isDrawing = false;
    currentStrokes.push([currentStrokeX, currentStrokeY]);

    autoTimer = setTimeout(() => {
      castSkill();
    }, 600);
  }
}

drawCanvas.addEventListener('mousedown', startDrawing);
drawCanvas.addEventListener('mousemove', draw);
drawCanvas.addEventListener('mouseup', stopDrawing);
drawCanvas.addEventListener('mouseleave', stopDrawing);

drawCanvas.addEventListener('touchstart', startDrawing);
drawCanvas.addEventListener('touchmove', draw);
drawCanvas.addEventListener('touchend', stopDrawing);

function clearDrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  currentStrokes = [];
  if (autoTimer) clearTimeout(autoTimer);
}

// 通常攻撃ボタン（クールダウン制限付き＆威力低減）
function normalAttack(type) {
  if (!gameActive || player.state !== 'idle' || attackCooldownTimer) return;

  // 連打防止（0.8秒クールダウン）
  attackCooldownTimer = true;
  document.getElementById('btnFist').disabled = true;
  document.getElementById('btnKick').disabled = true;

  setTimeout(() => {
    attackCooldownTimer = false;
    document.getElementById('btnFist').disabled = false;
    document.getElementById('btnKick').disabled = false;
  }, 800);

  const isFist = type === 'fist';
  player.state = isFist ? 'punch' : 'kick';
  player.timer = 12;

  const baseDmg = isFist ? 4 : 6;
  const dmg = Math.round(baseDmg * player.powerMult);
  const banner = document.getElementById('msgBanner');
  banner.textContent = isFist ? '【拳】パンチ！' : '【蹴】キック！';
  banner.style.color = isFist ? '#2563eb' : '#0284c7';

  player.x += 30;

  setTimeout(() => {
    enemy.hp = Math.max(0, enemy.hp - dmg);
    enemy.state = 'hit';
    enemy.timer = 8;
    shakeAmount = 2;
    createHitEffect(enemy.x, enemy.y - 20, isFist ? '#2563eb' : '#0284c7', isFist ? '拳 (FIST)' : '蹴 (KICK)', dmg);
    updateHpUI();
    checkGameEnd();
  }, 80);
}

// 漢字判定＆技発動
async function castSkill() {
  if (!gameActive) return;
  if (currentStrokes.length === 0) return;

  const banner = document.getElementById('msgBanner');
  banner.textContent = '判定中...';
  banner.style.color = '#fbbf24';

  let detectedKanji = null;

  try {
    const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=autodraw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        input_type: 0,
        requests: [{
          language: 'ja',
          writing_guide: { width: 200, height: 200 },
          ink: currentStrokes
        }]
      })
    });

    const data = await response.json();
    if (data[0] === 'SUCCESS') {
      const candidates = data[1][0][1];
      if (candidates.includes(currentTargetKey)) {
        detectedKanji = currentTargetKey;
      } else {
        for (let c of candidates) {
          if (SKILLS[c]) {
            detectedKanji = c;
            break;
          }
        }
      }
    }
  } catch (err) {
    console.warn("APIオフライン表示:", err);
    document.getElementById('fallbackArea').style.display = 'block';
    detectedKanji = document.getElementById('manualKanji').value;
  }

  if (detectedKanji && SKILLS[detectedKanji]) {
    executePlayerSkill(detectedKanji);

    if (comboIndex >= 0) {
      comboIndex++;
      if (comboIndex >= ULTIMATE_COMBO.length) {
        executeFinisherUltimate();
        comboIndex = -1;
      }
    }

    setRandomTarget();
  } else {
    banner.textContent = `失敗！ お題「${currentTargetKey}」を書いてね`;
    banner.style.color = '#ef4444';
    shakeAmount = 5;
  }

  clearDrawCanvas();
}

// 技の実行
function executePlayerSkill(kanji) {
  const skill = SKILLS[kanji];
  const banner = document.getElementById('msgBanner');
  banner.textContent = `【${kanji}】発動！ ${skill.name}！`;
  banner.style.color = skill.color;

  const dmg = Math.round(skill.damage * player.powerMult);

  if (kanji === '拳' || kanji === '蹴') {
    normalAttack(kanji === '拳' ? 'fist' : 'kick');
    return;
  }

  player.state = 'attack';
  player.timer = 20;
  player.x += 45;

  setTimeout(() => {
    enemy.hp = Math.max(0, enemy.hp - dmg);
    enemy.state = 'hit';
    enemy.timer = 12;
    shakeAmount = 10;
    createHitEffect(enemy.x, enemy.y - 20, skill.color, skill.name, dmg);
    updateHpUI();
    checkGameEnd();
  }, 120);
}

// 7連コンボ完奏の超必殺演出
function executeFinisherUltimate() {
  const banner = document.getElementById('msgBanner');
  banner.textContent = '【超必殺技】絶滅擂爆鐳改雷・フィニッシュ！！';
  banner.style.color = '#f59e0b';

  flashOverlay = 15;
  shakeAmount = 30;

  setTimeout(() => {
    const ultDmg = 120;
    enemy.hp = Math.max(0, enemy.hp - ultDmg);
    enemy.state = 'hit';
    enemy.timer = 30;
    createHitEffect(enemy.x, enemy.y - 30, '#f59e0b', 'ULTIMATE FINISH', ultDmg);
    updateHpUI();
    checkGameEnd();
  }, 300);
}

// 敵オート攻撃（威力＆頻度を大幅ダウン調整）
function enemyAttack() {
  if (!gameActive || enemy.hp <= 0) return;

  enemy.state = 'attack';
  enemy.timer = 18;
  enemy.x -= 50;

  const eChar = ENEMY_CHARS[currentEnemyKey];
  const dmg = Math.floor(Math.random() * 4) + 7; // 被ダメージ 7〜10程度に低下
  const banner = document.getElementById('msgBanner');
  banner.textContent = `${eChar.name}の攻撃！ ${dmg} 被弾！`;
  banner.style.color = '#f87171';

  setTimeout(() => {
    player.hp = Math.max(0, player.hp - dmg);
    player.state = 'hit';
    player.timer = 12;
    shakeAmount = 4;
    createHitEffect(player.x, player.y - 20, '#f87171', 'DAMAGE', dmg);
    updateHpUI();
    checkGameEnd();
  }, 150);
}

function updateHpUI() {
  document.getElementById('playerHpBar').style.width = `${(player.hp / player.maxHp) * 100}%`;
  document.getElementById('playerHpText').textContent = `${player.hp}/${player.maxHp}`;

  document.getElementById('enemyHpBar').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
  document.getElementById('enemyHpText').textContent = `${enemy.hp}/${enemy.maxHp}`;
}

function createHitEffect(x, y, color, label, amount) {
  effects.push({ x: x, y: y, color: color, label: label, amount: amount, life: 30, maxLife: 30 });
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      color: color, radius: Math.random() * 4 + 2, life: 20
    });
  }
}

function checkGameEnd() {
  if (enemy.hp <= 0) {
    gameActive = false;
    showModal('VICTORY!', `${ENEMY_CHARS[currentEnemyKey].name}を完全撃破！`, '#f59e0b');
  } else if (player.hp <= 0) {
    gameActive = false;
    showModal('DEFEAT...', '倒れてしまった...', '#ef4444');
  }
}

function showModal(title, desc, color) {
  const modal = document.getElementById('resultModal');
  const titleEl = document.getElementById('modalTitle');
  titleEl.textContent = title;
  titleEl.style.color = color;
  document.getElementById('modalDesc').textContent = desc;
  modal.classList.add('active');
}

// リセット時も設定キャラをそのまま引き継ぎ
function resetGame() {
  comboIndex = -1;
  const p = PLAYER_CHARS[currentCharKey];
  const e = ENEMY_CHARS[currentEnemyKey];
  player.maxHp = p.hp; player.hp = p.hp;
  enemy.maxHp = e.hp; enemy.hp = e.hp;
  enemy.attackCooldown = e.attackInterval;

  gameActive = true;
  updateHpUI();
  setRandomTarget();
  document.getElementById('resultModal').classList.remove('active');
  document.getElementById('msgBanner').textContent = '手書きすると自動で判定＆技発動！';
  document.getElementById('msgBanner').style.color = '#38bdf8';
  clearDrawCanvas();
}

// --- 自動ポジション調整 ---
let moveFrame = 0;
function updateAutoMovement() {
  if (!gameActive) return;
  moveFrame++;

  if (player.state === 'idle') {
    const pOffset = Math.sin(moveFrame * 0.05) * 15;
    player.x += ((player.baseTargetX + pOffset) - player.x) * 0.1;
  }

  if (enemy.state === 'idle') {
    const eOffset = Math.cos(moveFrame * 0.04) * 20;
    enemy.x += ((enemy.baseTargetX + eOffset) - enemy.x) * 0.1;
  }
}

// --- バトル描画 Canvas ---
const stageCanvas = document.getElementById('stageCanvas');
const stageCtx = stageCanvas.getContext('2d');

function renderStage() {
  updateAutoMovement();

  stageCtx.save();

  if (flashOverlay > 0) {
    flashOverlay--;
    stageCtx.fillStyle = '#ffffff';
    stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);
  }

  if (shakeAmount > 0) {
    const sx = (Math.random() - 0.5) * shakeAmount;
    const sy = (Math.random() - 0.5) * shakeAmount;
    stageCtx.translate(sx, sy);
    shakeAmount *= 0.88;
    if (shakeAmount < 0.5) shakeAmount = 0;
  }

  // 背景
  stageCtx.fillStyle = '#090d16';
  stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);

  // ステージ床
  stageCtx.fillStyle = '#1f2937';
  stageCtx.beginPath();
  stageCtx.ellipse(250, 175, 220, 20, 0, 0, Math.PI * 2);
  stageCtx.fill();

  // プレイヤー描画
  stageCtx.save();
  let px = player.x;
  let py = player.y;

  const pChar = PLAYER_CHARS[currentCharKey];
  stageCtx.fillStyle = player.state === 'hit' ? '#ef4444' : pChar.color;
  stageCtx.strokeStyle = stageCtx.fillStyle;
  stageCtx.lineWidth = 4;

  stageCtx.beginPath();
  stageCtx.arc(px, py - 28, 11, 0, Math.PI * 2);
  stageCtx.fill();

  stageCtx.beginPath();
  stageCtx.moveTo(px, py - 17); stageCtx.lineTo(px, py + 10);

  if (player.state === 'punch') {
    stageCtx.moveTo(px, py - 10); stageCtx.lineTo(px + 26, py - 10);
  } else {
    stageCtx.moveTo(px, py - 10); stageCtx.lineTo(px + 10, py - 3);
  }

  if (player.state === 'kick') {
    stageCtx.moveTo(px, py + 10); stageCtx.lineTo(px + 24, py - 3);
    stageCtx.moveTo(px, py + 10); stageCtx.lineTo(px - 10, py + 22);
  } else {
    stageCtx.moveTo(px, py + 10); stageCtx.lineTo(px + 8, py + 22);
    stageCtx.moveTo(px, py + 10); stageCtx.lineTo(px - 8, py + 22);
  }
  stageCtx.stroke();
  stageCtx.restore();

  // 敵 描画
  stageCtx.save();
  let ex = enemy.x;
  let ey = enemy.y;

  const eChar = ENEMY_CHARS[currentEnemyKey];
  stageCtx.fillStyle = enemy.state === 'hit' ? '#ffffff' : eChar.color;

  stageCtx.beginPath();
  stageCtx.arc(ex, ey - 20, 22, 0, Math.PI * 2);
  stageCtx.fill();

  stageCtx.beginPath();
  stageCtx.moveTo(ex - 8, ey - 38); stageCtx.lineTo(ex - 20, ey - 54); stageCtx.lineTo(ex - 2, ey - 40);
  stageCtx.moveTo(ex + 8, ey - 38); stageCtx.lineTo(ex + 20, ey - 54); stageCtx.lineTo(ex + 2, ey - 40);
  stageCtx.fill();

  stageCtx.fillStyle = '#facc15';
  stageCtx.beginPath();
  stageCtx.arc(ex - 7, ey - 22, 3.5, 0, Math.PI * 2);
  stageCtx.arc(ex + 7, ey - 22, 3.5, 0, Math.PI * 2);
  stageCtx.fill();
  stageCtx.restore();

  // エフェクト
  for (let i = effects.length - 1; i >= 0; i--) {
    let eff = effects[i];
    stageCtx.save();
    stageCtx.font = 'bold 16px sans-serif';
    stageCtx.fillStyle = eff.color;
    stageCtx.textAlign = 'center';
    stageCtx.globalAlpha = eff.life / eff.maxLife;
    stageCtx.fillText(`${eff.label} -${eff.amount}`, eff.x, eff.y - (eff.maxLife - eff.life) * 1.5);
    stageCtx.restore();

    eff.life--;
    if (eff.life <= 0) effects.splice(i, 1);
  }

  // パーティクル
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    stageCtx.fillStyle = p.color;
    stageCtx.beginPath();
    stageCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    stageCtx.fill();

    p.x += p.vx; p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  stageCtx.restore();

  if (player.timer > 0) { player.timer--; if (player.timer === 0) player.state = 'idle'; }
  if (enemy.timer > 0) { enemy.timer--; if (enemy.timer === 0) enemy.state = 'idle'; }

  if (gameActive) {
    enemy.attackCooldown--;
    if (enemy.attackCooldown <= 0) {
      enemyAttack();
      enemy.attackCooldown = ENEMY_CHARS[currentEnemyKey].attackInterval;
    }
  }

  requestAnimationFrame(renderStage);
}

// 初期化
window.onload = () => {
  setRandomTarget();
  changePlayerCharacter();
  changeEnemyCharacter();
  renderStage();
};
</script>
