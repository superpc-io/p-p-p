<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>漢字手書きバトル IV - バランス調整版 -</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090d16;
      color: #fff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .game-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* バトル画面 Canvas */
    .stage-card {
      position: relative;
      background: #111827;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 2px solid #1f2937;
    }

    #stageCanvas {
      width: 100%;
      height: 200px;
      display: block;
      background: #000;
    }

    /* HUD (HPバー等) */
    .hud {
      position: absolute;
      top: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }

    .fighter-hud {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(4px);
    }

    .fighter-name {
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .hp-bar-bg {
      height: 10px;
      background: #334155;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid #475569;
    }

    .hp-bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.2s ease;
    }

    .player-hp { background: linear-gradient(90deg, #10b981, #34d399); }
    .enemy-hp { background: linear-gradient(90deg, #ef4444, #f87171); }

    /* コマンド＆手書きエリア */
    .controls-card {
      background: #111827;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
      border: 2px solid #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* キャラ選択 */
    .char-select-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #1f2937;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 11px;
    }

    .char-select-bar select {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: bold;
      outline: none;
    }

    /* お題指示表示 */
    .target-box {
      width: 100%;
      background: #030712;
      border: 2px solid #f59e0b;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      box-shadow: inset 0 0 10px rgba(245, 158, 11, 0.25);
      position: relative;
    }

    .target-title {
      font-size: 10px;
      color: #9ca3af;
    }

    .target-kanji-display {
      font-size: 28px;
      font-weight: 900;
      color: #fbbf24;
      line-height: 1.1;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .target-desc {
      font-size: 11px;
      color: #d1d5db;
      font-weight: bold;
    }

    /* コンボゲージ表示 */
    .combo-badge {
      display: none;
      font-size: 12px;
      color: #f43f5e;
      font-weight: bold;
      animation: pulse 0.5s infinite alternate;
    }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); } }

    /* 手書きCanvas wrapping */
    .canvas-wrapper {
      position: relative;
      touch-action: none;
    }

    #drawCanvas {
      border: 3px solid #f59e0b;
      border-radius: 12px;
      background-color: #1f2937;
      cursor: crosshair;
      touch-action: none;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
      display: block;
    }

    /* お手本文字ガイド */
    .canvas-guide-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 130px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.09);
      pointer-events: none;
      line-height: 1;
    }

    .canvas-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      border-radius: 12px;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    button {
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:active {
      transform: scale(0.94);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn-fist {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      flex: 1;
      font-size: 13px;
    }

    .btn-kick {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      flex: 1;
      font-size: 13px;
    }

    .btn-clear {
      background: #4b5563;
      color: white;
      flex: 0.8;
      font-size: 13px;
    }

    .btn-attack {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      flex: 1.5;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
    }

    /* メッセージ表示 */
    .msg-banner {
      min-height: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #38bdf8;
      text-align: center;
    }

    /* 勝敗モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: #111827;
      padding: 24px 32px;
      border-radius: 16px;
      text-align: center;
      border: 2px solid #f59e0b;
      max-width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      font-size: 32px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .modal-btn {
      background: #f59e0b;
      color: #111;
      font-size: 18px;
      padding: 10px 24px;
      margin-top: 15px;
      width: 100%;
    }

    /* オフライン・フォールバック */
    .fallback-select {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 11px;
      color: #9ca3af;
      background: rgba(255,255,255,0.05);
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      justify-content: space-between;
    }
    .fallback-select select {
      background: #374151;
      color: #fff;
      border: 1px solid #4b5563;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .offline-tag {
      color: #f59e0b;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="game-container">
  <!-- バトル画面 Canvas -->
  <div class="stage-card">
    <canvas id="stageCanvas" width="500" height="200"></canvas>

    <div class="hud">
      <div class="fighter-hud">
        <div class="fighter-name">
          <span id="playerName">武神 (YOU)</span>
          <span id="playerHpText">100/100</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill player-hp" id="playerHpBar"></div>
        </div>
      </div>

      <div class="fighter-hud">
        <div class="fighter-name">
          <span id="enemyName">羅刹王 (BOSS)</span>
          <span id="enemyHpText">200/200</span>
        </div>
        <div class="hp-bar-bg">
          <div class="hp-bar-fill enemy-hp" id="enemyHpBar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 操作・手書きエリア -->
  <div class="controls-card">
    <!-- キャラクター選択 -->
    <div class="char-select-bar">
      <div>
        自キャラ:
        <select id="playerCharSelect" onchange="changePlayerCharacter()">
          <option value="bujin">武神 (標準)</option>
          <option value="hayate">疾風 (高速)</option>
          <option value="goken">剛拳 (力豪)</option>
        </select>
      </div>
      <div>
        対戦相手:
        <select id="enemyCharSelect" onchange="changeEnemyCharacter()">
          <option value="rasetsu">羅刹王 (標準)</option>
          <option value="houou">鳳凰帝 (高速)</option>
          <option value="ankoku">暗黒騎士 (耐久)</option>
        </select>
      </div>
      <div>
        難易度:
        <select id="difficultySelect" onchange="changeDifficulty()">
          <option value="normal">普通</option>
          <option value="hard" selected>ハード (推奨)</option>
          <option value="oni">鬼畜</option>
        </select>
      </div>
    </div>

    <!-- お題指示表示 -->
    <div class="target-box">
      <div class="target-title">【目標漢字コマンド（書くと自動判定）】</div>
      <div class="target-kanji-display" id="targetKanji">絶</div>
      <div class="target-desc" id="targetDesc">絶影連撃 (威力: 32)</div>
      <div class="combo-badge" id="comboBadge">🔥 7連超必殺コンボ進行中！ 🔥</div>
    </div>

    <!-- メッセージ -->
    <div class="msg-banner" id="msgBanner">手書きすると自動で判定＆技発動！</div>

    <!-- 手書きCanvas -->
    <div class="canvas-wrapper">
      <div class="canvas-guide-text" id="canvasGuide">絶</div>
      <canvas id="drawCanvas" width="220" height="220"></canvas>
      <svg class="canvas-grid" viewBox="0 0 220 220">
        <line x1="110" y1="0" x2="110" y2="220" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4" />
        <line x1="0" y1="110" x2="220" y2="110" stroke="rgba(255,255,255,0.08)" stroke-dasharray="4,4" />
      </svg>
    </div>

    <!-- ボタン群 -->
    <div class="btn-row">
      <button class="btn-fist" id="btnFist" onclick="normalAttack('fist')">拳 (パンチ)</button>
      <button class="btn-kick" id="btnKick" onclick="normalAttack('kick')">蹴 (キック)</button>
      <button class="btn-clear" onclick="clearDrawCanvas()">消去</button>
      <button class="btn-attack" id="attackBtn" onclick="castSkill()">手動判定 / 発動</button>
    </div>

    <!-- オフライン/ローカル時フォールバック -->
    <div class="fallback-select" id="fallbackArea">
      <span><span class="offline-tag" id="statusTag">⚡ API連携中</span> 選択技:</span>
      <select id="manualKanji">
        <option value="auto">目標に従う (手書き優先)</option>
        <option value="拳">拳 (直拳衝)</option>
        <option value="蹴">蹴 (疾風蹴)</option>
        <option value="絶">絶 (絶影連撃)</option>
        <option value="滅">滅 (滅殺波動)</option>
        <option value="擂">擂 (擂台崩落)</option>
        <option value="爆">爆 (爆炎連打)</option>
        <option value="鐳">鐳 (鐳光破撃)</option>
        <option value="改">改 (改天換地)</option>
        <option value="雷">雷 (雷帝召喚)</option>
      </select>
    </div>
  </div>
</div>

<!-- 勝敗判定モーダル -->
<div class="modal-overlay" id="resultModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">VICTORY!</div>
    <p id="modalDesc">見事なコンボで撃破した！</p>
    <button class="modal-btn" onclick="resetGame()">再戦する</button>
  </div>
</div>

<script>
// --- キャラデータ (敵のステータスを大幅強化) ---
const PLAYER_CHARS = {
  bujin: { name: '武神', hp: 100, color: '#38bdf8', powerMult: 1.0 },
  hayate: { name: '疾風', hp: 85, color: '#2dd4bf', powerMult: 0.9 },
  goken: { name: '剛拳', hp: 130, color: '#fb923c', powerMult: 1.25 }
};

const ENEMY_CHARS = {
  rasetsu: { name: '羅刹王', hp: 350, color: '#f43f5e', attackInterval: 100, baseDmg: 14 },
  houou: { name: '鳳凰帝', hp: 280, color: '#facc15', attackInterval: 65, baseDmg: 12 },
  ankoku: { name: '暗黒騎士', hp: 500, color: '#a855f7', attackInterval: 130, baseDmg: 20 }
};

// 各漢字の基準画数 (厳格判定用)
const KANJI_STROKES = {
  '絶': 12, '滅': 13, '擂': 16, '爆': 19,
  '鐳': 21, '改': 7,  '雷': 13, '拳': 10, '蹴': 19
};

let difficultyMult = 1.2; // ハード基準

function changeDifficulty() {
  const diff = document.getElementById('difficultySelect').value;
  if (diff === 'normal') difficultyMult = 0.8;
  if (diff === 'hard') difficultyMult = 1.2;
  if (diff === 'oni') difficultyMult = 2.0;
}

// --- 漢字技データ ---
const SKILLS = {
  '拳': { name: '直拳衝', damage: 8, color: '#2563eb' },
  '蹴': { name: '疾風蹴', damage: 12, color: '#0284c7' },
  '絶': { name: '絶影連撃', damage: 32, color: '#38bdf8' },
  '滅': { name: '滅殺波動', damage: 40, color: '#f43f5e' },
  '擂': { name: '擂台崩落', damage: 38, color: '#a855f7' },
  '爆': { name: '爆炎連打', damage: 45, color: '#f97316' },
  '鐳': { name: '鐳光破撃', damage: 50, color: '#eab308' },
  '改': { name: '改天換地', damage: 38, color: '#10b981' },
  '雷': { name: '雷帝召喚', damage: 55, color: '#c084fc' }
};

// 7連コンボ（超必殺技の漢字シーケンス）
const ULTIMATE_COMBO = ['絶', '滅', '擂', '爆', '鐳', '改', '雷'];
let comboIndex = -1;

const KANJI_KEYS = ['絶', '滅', '擂', '爆', '鐳', '改', '雷', '拳', '蹴'];
let currentTargetKey = '絶';

function setRandomTarget() {
  if (comboIndex === -1 && Math.random() < 0.2) {
    comboIndex = 0;
  }

  if (comboIndex >= 0) {
    currentTargetKey = ULTIMATE_COMBO[comboIndex];
    document.getElementById('comboBadge').style.display = 'block';
    document.getElementById('comboBadge').textContent = `🔥 超必殺コンボ [${comboIndex + 1}/7]: 【${currentTargetKey}】 🔥`;
    document.getElementById('targetKanji').textContent = `超必殺: ${currentTargetKey}`;
  } else {
    document.getElementById('comboBadge').style.display = 'none';
    currentTargetKey = KANJI_KEYS[Math.floor(Math.random() * KANJI_KEYS.length)];
    document.getElementById('targetKanji').textContent = currentTargetKey;
  }

  const sk = SKILLS[currentTargetKey] || { name: '連撃', damage: 30, color: '#fbbf24' };
  document.getElementById('targetKanji').style.color = sk.color;
  document.getElementById('targetDesc').textContent = `${sk.name} (威力: ${sk.damage})`;
  document.getElementById('canvasGuide').textContent = currentTargetKey;
}

// Web Audio API Sound Effects
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSfx(type) {
  try {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'skill') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.25);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === 'win') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(523, now); // C5
      osc.frequency.setValueAtTime(659, now + 0.1); // E5
      osc.frequency.setValueAtTime(783, now + 0.2); // G5
      osc.frequency.setValueAtTime(1046, now + 0.3); // C6
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
    } else if (type === 'lose') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.linearRampToValueAtTime(80, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  } catch(e) {}
}

// --- ゲーム状態変数 ---
let playerKey = 'bujin';
let enemyKey = 'rasetsu';
let playerHp = 100;
let playerMaxHp = 100;
let enemyHp = 200;
let enemyMaxHp = 200;

let isGameOver = false;
let enemyTimer = 0;

// アニメーション用状態
let playerAnim = { x: 120, y: 140, state: 'idle', frame: 0 };
let enemyAnim = { x: 380, y: 140, state: 'idle', frame: 0 };
let particles = [];
let floatingTexts = [];

// ステージ Canvas Init
const stageCanvas = document.getElementById('stageCanvas');
const stageCtx = stageCanvas.getContext('2d');

function updateHpBars() {
  const pPct = Math.max(0, (playerHp / playerMaxHp) * 100);
  const ePct = Math.max(0, (enemyHp / enemyMaxHp) * 100);

  document.getElementById('playerHpBar').style.width = pPct + '%';
  document.getElementById('enemyHpBar').style.width = ePct + '%';
  document.getElementById('playerHpText').textContent = `${Math.ceil(playerHp)}/${playerMaxHp}`;
  document.getElementById('enemyHpText').textContent = `${Math.ceil(enemyHp)}/${enemyMaxHp}`;
}

function changePlayerCharacter() {
  playerKey = document.getElementById('playerCharSelect').value;
  const p = PLAYER_CHARS[playerKey];
  playerHp = p.hp;
  playerMaxHp = p.hp;
  document.getElementById('playerName').textContent = `${p.name} (YOU)`;
  updateHpBars();
}

function changeEnemyCharacter() {
  enemyKey = document.getElementById('enemyCharSelect').value;
  const e = ENEMY_CHARS[enemyKey];
  enemyHp = e.hp;
  enemyMaxHp = e.hp;
  document.getElementById('enemyName').textContent = `${e.name} (BOSS)`;
  updateHpBars();
}

function addFloatingText(text, x, y, color = '#fbbf24') {
  floatingTexts.push({ text, x, y, color, life: 1.0, vy: -1.5 });
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      color,
      size: 3 + Math.random() * 4,
      life: 1.0
    });
  }
}

// 描画ループ
function gameLoop() {
  // 背景更新
  stageCtx.fillStyle = '#0f172a';
  stageCtx.fillRect(0, 0, stageCanvas.width, stageCanvas.height);

  // 床グリッド線
  stageCtx.strokeStyle = '#1e293b';
  stageCtx.lineWidth = 2;
  stageCtx.beginPath();
  stageCtx.moveTo(0, 160);
  stageCtx.lineTo(500, 160);
  stageCtx.stroke();

  if (!isGameOver) {
    // 敵オートアタックタイマー
    const eConf = ENEMY_CHARS[enemyKey];
    enemyTimer++;
    if (enemyTimer >= eConf.attackInterval) {
      enemyTimer = 0;
      enemyAttack();
    }
  }

  // プレイヤー描画 (ボクセル/スプライト風)
  drawFighter(playerAnim, PLAYER_CHARS[playerKey].color, true);
  drawFighter(enemyAnim, ENEMY_CHARS[enemyKey].color, false);

  // パーティクル処理
  for (let i = particles.length - 1; i >= 0; i--) {
    let pt = particles[i];
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.life -= 0.03;
    stageCtx.fillStyle = pt.color;
    stageCtx.globalAlpha = Math.max(0, pt.life);
    stageCtx.beginPath();
    stageCtx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
    stageCtx.fill();
    if (pt.life <= 0) particles.splice(i, 1);
  }
  stageCtx.globalAlpha = 1.0;

  // フローティングテキスト処理
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y += ft.vy;
    ft.life -= 0.02;
    stageCtx.font = '900 18px sans-serif';
    stageCtx.fillStyle = ft.color;
    stageCtx.globalAlpha = Math.max(0, ft.life);
    stageCtx.fillText(ft.text, ft.x, ft.y);
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
  stageCtx.globalAlpha = 1.0;

  requestAnimationFrame(gameLoop);
}

function drawFighter(anim, color, isPlayer) {
  stageCtx.save();
  let offsetX = anim.x;
  let offsetY = anim.y;

  // アニメーション計算
  if (anim.state === 'attack') {
    offsetX += isPlayer ? 30 : -30;
    anim.frame++;
    if (anim.frame > 10) { anim.state = 'idle'; anim.frame = 0; }
  } else if (anim.state === 'hit') {
    offsetX += isPlayer ? -15 : 15;
    anim.frame++;
    if (anim.frame > 8) { anim.state = 'idle'; anim.frame = 0; }
  }

  stageCtx.translate(offsetX, offsetY);
  if (!isPlayer) stageCtx.scale(-1, 1);

  // キャラクター影
  stageCtx.fillStyle = 'rgba(0,0,0,0.4)';
  stageCtx.beginPath();
  stageCtx.ellipse(0, 15, 20, 6, 0, 0, Math.PI * 2);
  stageCtx.fill();

  // キャラクター本体 (スタイリッシュな棒人間)
  stageCtx.strokeStyle = color;
  stageCtx.lineWidth = 5;
  stageCtx.lineCap = 'round';

  // 頭
  stageCtx.beginPath();
  stageCtx.arc(0, -35, 10, 0, Math.PI * 2);
  stageCtx.stroke();

  // 胴体
  stageCtx.beginPath();
  stageCtx.moveTo(0, -25);
  stageCtx.lineTo(0, 0);
  stageCtx.stroke();

  // 腕
  stageCtx.beginPath();
  if (anim.state === 'attack') {
    stageCtx.moveTo(0, -20);
    stageCtx.lineTo(20, -20);
  } else {
    stageCtx.moveTo(0, -20);
    stageCtx.lineTo(10, -10);
  }
  stageCtx.stroke();

  // 脚
  stageCtx.beginPath();
  stageCtx.moveTo(0, 0);
  stageCtx.lineTo(-10, 15);
  stageCtx.moveTo(0, 0);
  stageCtx.lineTo(10, 15);
  stageCtx.stroke();

  stageCtx.restore();
}

function enemyAttack() {
  if (isGameOver) return;
  enemyAnim.state = 'attack';
  enemyAnim.frame = 0;
  playerAnim.state = 'hit';
  playerAnim.frame = 0;

  const eConf = ENEMY_CHARS[enemyKey];
  const dmg = Math.floor((eConf.baseDmg + Math.random() * 8) * difficultyMult);
  playerHp = Math.max(0, playerHp - dmg);
  updateHpBars();

  addFloatingText(`-${dmg}`, playerAnim.x - 10, playerAnim.y - 40, '#f43f5e');
  spawnParticles(playerAnim.x, playerAnim.y - 20, '#f43f5e', 10);
  playSfx('hit');

  if (playerHp <= 0) {
    endGame(false);
  }
}

// --- 手書き Canvas 制御 ---
const drawCanvas = document.getElementById('drawCanvas');
const drawCtx = drawCanvas.getContext('2d');

let isDrawing = false;
let currentStrokes = [];
let currentStrokeX = [];
let currentStrokeY = [];
let autoSubmitTimer = null;

drawCtx.lineWidth = 7;
drawCtx.lineCap = 'round';
drawCtx.lineJoin = 'round';
drawCtx.strokeStyle = '#38bdf8';

function getCanvasCoords(e) {
  const rect = drawCanvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return {
    x: Math.round(clientX - rect.left),
    y: Math.round(clientY - rect.top)
  };
}

function startDrawing(e) {
  if (isGameOver) return;
  e.preventDefault();
  isDrawing = true;
  clearTimeout(autoSubmitTimer);

  const pos = getCanvasCoords(e);
  drawCtx.beginPath();
  drawCtx.moveTo(pos.x, pos.y);

  currentStrokeX = [pos.x];
  currentStrokeY = [pos.y];
}

function draw(e) {
  if (!isDrawing) return;
  e.preventDefault();
  const pos = getCanvasCoords(e);
  drawCtx.lineTo(pos.x, pos.y);
  drawCtx.stroke();

  currentStrokeX.push(pos.x);
  currentStrokeY.push(pos.y);
}

function stopDrawing(e) {
  if (isDrawing) {
    isDrawing = false;
    currentStrokes.push([currentStrokeX, currentStrokeY]);

    // 描画終了後 700ms 後に自動判定
    autoSubmitTimer = setTimeout(() => {
      castSkill();
    }, 700);
  }
}

drawCanvas.addEventListener('mousedown', startDrawing);
drawCanvas.addEventListener('mousemove', draw);
drawCanvas.addEventListener('mouseup', stopDrawing);
drawCanvas.addEventListener('mouseleave', stopDrawing);

drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
drawCanvas.addEventListener('touchmove', draw, { passive: false });
drawCanvas.addEventListener('touchend', stopDrawing);

function clearDrawCanvas() {
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  currentStrokes = [];
  currentStrokeX = [];
  currentStrokeY = [];
  clearTimeout(autoSubmitTimer);
}

// --- 判定 & 攻撃処理 (CORS/Adblock Safe) ---
let isUsingFallbackMode = false;

async function castSkill() {
  if (isGameOver) return;

  const manualVal = document.getElementById('manualKanji').value;

  // 手書き入力が無い場合
  if (currentStrokes.length === 0) {
    if (manualVal !== 'auto') {
      executeSkill(manualVal);
    } else {
      document.getElementById('msgBanner').textContent = '⚠️ 枠内に漢字をしっかり書いてね！';
    }
    return;
  }

  document.getElementById('msgBanner').textContent = '🔍 厳格判定中...';
  let recognizedKanji = null;
  let isStrictSuccess = false;

  // Google Handwriting API呼び出し
  if (!isUsingFallbackMode) {
    try {
      const response = await fetch('https://inputtools.google.com/request?itc=ja-t-i0-handwrit&app=autodraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input_type: 0,
          requests: [{
            language: 'ja',
            writing_guide: { width: 220, height: 220 },
            ink: currentStrokes
          }]
        })
      });

      if (response.ok) {
        const data = await response.json();
        if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1]) {
          const candidates = data[1][0][1];
          
          // 判定強化：上位3位候補までに目的の漢字が含まれているか厳しく判定！
          const topCandidates = candidates.slice(0, 3);
          if (topCandidates.includes(currentTargetKey)) {
            recognizedKanji = currentTargetKey;
            isStrictSuccess = true;
          } else if (candidates.length > 0) {
            recognizedKanji = candidates[0]; // 全く違う漢字が書かれた場合
          }
        }
      }
    } catch (err) {
      console.warn('Google Recognition API unavailable. Switching to fallback mode.');
      isUsingFallbackMode = true;
      document.getElementById('statusTag').textContent = '🛡️ ローカル画数判定';
      document.getElementById('statusTag').style.color = '#38bdf8';
    }
  }

  // ローカル/フォールバック判定 (画数と描画量のチェックを厳格化)
  if (!isStrictSuccess && isUsingFallbackMode) {
    if (manualVal !== 'auto') {
      recognizedKanji = manualVal;
      isStrictSuccess = true;
    } else {
      const targetStrokes = KANJI_STROKES[currentTargetKey] || 10;
      const actualStrokes = currentStrokes.length;
      
      // ストローク数（画数）がお題の±3画以内かつ、十分な線描画がある場合のみ合格
      let totalLength = 0;
      currentStrokes.forEach(s => { totalLength += s[0].length; });

      if (Math.abs(actualStrokes - targetStrokes) <= 3 && totalLength >= 15) {
        recognizedKanji = currentTargetKey;
        isStrictSuccess = true;
      }
    }
  }

  // 判定結果の適用
  if (isStrictSuccess && recognizedKanji === currentTargetKey) {
    executeSkill(recognizedKanji);
  } else {
    // 判定失敗（MISS）
    document.getElementById('msgBanner').textContent = `❌ MISS! 判定失敗 (認識: ${recognizedKanji || '不明'}) 正確に書こう！`;
    addFloatingText('MISS!', enemyAnim.x - 10, enemyAnim.y - 40, '#9ca3af');
    playSfx('hit');
    comboIndex = -1; // コンボ中断
    document.getElementById('comboBadge').style.display = 'none';
  }

  clearDrawCanvas();
}

function normalAttack(type) {
  if (isGameOver) return;
  const key = type === 'fist' ? '拳' : '蹴';
  executeSkill(key);
}

function executeSkill(kanji) {
  const sk = SKILLS[kanji] || { name: '打撃', damage: 10, color: '#fbbf24' };
  const pConf = PLAYER_CHARS[playerKey];
  const dmg = Math.floor(sk.damage * pConf.powerMult);

  // 演出
  playerAnim.state = 'attack';
  playerAnim.frame = 0;
  enemyAnim.state = 'hit';
  enemyAnim.frame = 0;

  enemyHp = Math.max(0, enemyHp - dmg);
  updateHpBars();

  // コンボ判定
  if (comboIndex >= 0 && kanji === ULTIMATE_COMBO[comboIndex]) {
    comboIndex++;
    if (comboIndex >= ULTIMATE_COMBO.length) {
      document.getElementById('msgBanner').textContent = `💥 超必殺7連コンボコンプリート！！ 絶大なダメージ！`;
      comboIndex = -1;
    } else {
      document.getElementById('msgBanner').textContent = `✨ ${sk.name} 発動！ [コンボ ${comboIndex}/7]`;
    }
  } else {
    comboIndex = -1;
    document.getElementById('msgBanner').textContent = `✨ ${sk.name} (威力:${dmg}) 発動！`;
  }

  addFloatingText(`-${dmg}`, enemyAnim.x - 10, enemyAnim.y - 40, sk.color);
  spawnParticles(enemyAnim.x, enemyAnim.y - 20, sk.color, 14);
  playSfx('skill');

  setRandomTarget();

  if (enemyHp <= 0) {
    endGame(true);
  }
}

function endGame(isWin) {
  isGameOver = true;
  const modal = document.getElementById('resultModal');
  const title = document.getElementById('modalTitle');
  const desc = document.getElementById('modalDesc');

  modal.classList.add('active');

  if (isWin) {
    title.textContent = 'VICTORY!';
    title.style.color = '#34d399';
    desc.textContent = '見事な手書きコンボで強敵を破った！';
    playSfx('win');
  } else {
    title.textContent = 'DEFEAT...';
    title.style.color = '#f87171';
    desc.textContent = '敗北してしまった... もう一度挑戦しよう！';
    playSfx('lose');
  }
}

function resetGame() {
  document.getElementById('resultModal').classList.remove('active');
  isGameOver = false;
  comboIndex = -1;
  changePlayerCharacter();
  changeEnemyCharacter();
  setRandomTarget();
  clearDrawCanvas();
  document.getElementById('msgBanner').textContent = '手書きすると自動で判定＆技発動！';
}

// 初期化実行
window.onload = function() {
  changePlayerCharacter();
  changeEnemyCharacter();
  setRandomTarget();
  gameLoop();
};
</script>
